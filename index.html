<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotesShare SMANEKA - Platform Berbagi Catatan</title>
    <!-- Menghubungkan file gaya CSS eksternal -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / Menu Atas dengan Logo -->
    <header>
        <div class="logo">
            <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjyFQBnfPD9f9ubP2808EGs47t_3Qd40i0AvKRfjZ7nZqHKEFxsrX3sskWWz2US6BeB7W9ELOiEJ0xS31oyRKuiocW2njHPrfdHUfhT8MJEut1vrl3SIvLu8hrFJ7n0oiQKXJXAPn6ZIOpT/s1600/SMANEKA3.png.jpg" alt="Logo SMA Negeri Kesamben" class="logo-img">
            <span>NotesShare SMANEKA</span>
        </div>
        <button class="nav-btn" onclick="toggleModal(true)">+ Unggah Catatan</button>
    </header>

    <!-- Bagian Pengantar (HERO SECTION) -->
    <section class="hero">
        <h1>Pusat Catatan & Rangkuman Pelajaran</h1>
        <p>Cari ringkasan materi, rumus cepat, dan peta konsep dari siswa SMA Negeri Kesamben.</p>
    </section>

    <!-- Tombol Filter Berdasarkan Kelas (Kelas 10, 11, 12) -->
    <div class="filter-container">
        <button class="filter-btn active" onclick="filterGrade('all')">Semua Kelas</button>
        <button class="filter-btn" onclick="filterGrade('10')">Kelas 10</button>
        <button class="filter-btn" onclick="filterGrade('11')">Kelas 11</button>
        <button class="filter-btn" onclick="filterGrade('12')">Kelas 12</button>
    </div>

    <!-- Kotak Pencarian Catatan -->
    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Cari mata pelajaran atau topik..." onkeyup="searchNotes()">
    </div>

    <!-- Bagian Konten Utama Daftar Catatan -->
    <main>
        <div class="section-title">Daftar Catatan Siswa</div>
        <div class="notes-grid" id="notesGrid">
            <!-- Kartu catatan akan dimasukkan secara dinamis via JavaScript -->
        </div>
    </main>

    <!-- Formulir Melayang (MODAL TAMBAH CATATAN) -->
    <div class="modal-overlay" id="uploadModal">
        <div class="modal-box">
            <h2>Bagikan Catatanmu</h2>
            <div class="form-group">
                <label>Pilih Tingkat Kelas</label>
                <select id="inputGrade" class="search-input">
                    <option value="10">Kelas 10</option>
                    <option value="11">Kelas 11</option>
                    <option value="12">Kelas 12</option>
                </select>
            </div>
            <div class="form-group">
                <label>Mata Pelajaran / Kategori</label>
                <input type="text" id="inputSubject" placeholder="Contoh: Ekonomi">
            </div>
            <div class="form-group">
                <label>Judul Catatan</label>
                <input type="text" id="inputTitle" placeholder="Contoh: Permintaan dan Penawaran">
            </div>
            <div class="form-group">
                <label>Deskripsi Singkat / Ringkasan</label>
                <textarea id="inputDesc" rows="3" placeholder="Jelaskan isi singkat ringkasanmu..."></textarea>
            </div>
            <div class="form-group">
                <label>Nama Pembuat / Pengunggah</label>
                <input type="text" id="inputAuthor" placeholder="Nama & Kelasmu">
            </div>
            <!-- Input Berkas untuk Upload PDF/Gambar/Dokumen -->
            <div class="form-group">
                <label>Lampirkan Berkas (PDF / Gambar / Doc) - <i>Opsional</i></label>
                <input type="file" id="inputFile" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg,.txt">
            </div>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="toggleModal(false)">Batal</button>
                <button class="btn-submit" onclick="addNewNote()">Simpan & Unggah</button>
            </div>
        </div>
    </div>

    <!-- Bagian Bawah Web (FOOTER) -->
    <footer>
        <p>&copy; 2026 NotesShare SMA Negeri Kesamben Jombang.</p>
        <p>Dibuat dan dikembangkan oleh: <strong>Siswa SMANEKA / [Nama Anda]</strong></p>
    </footer>

    <!-- Menghubungkan file interaktif JavaScript eksternal -->
    <script src="script.js"></script>
</body>
</html>
